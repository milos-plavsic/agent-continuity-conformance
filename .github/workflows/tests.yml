name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and quality tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Run lint checks
        run: ruff check .
      - name: Run static type checks
        run: mypy --ignore-missing-imports continuity_conformance
      - name: Run tests with branch coverage and JSON report
        run: |
          mkdir -p test-artifacts
          python -m pytest --cov=continuity_conformance --cov-branch --cov-report=term-missing --json-report --json-report-file=test-artifacts/pytest-report.json
      - name: Upload machine-readable test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-python-${{ matrix.python-version }}
          path: test-artifacts/pytest-report.json
          if-no-files-found: warn
      - name: Audit installed dependencies
        run: pip-audit
      - name: Build wheel
        run: python -m build --wheel
      - name: Verify non-editable wheel installation
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/wheel-venv/bin/python -c "import continuity_conformance; print('wheel import passed')"
          /tmp/wheel-venv/bin/continuity-demo
