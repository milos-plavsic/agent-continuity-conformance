[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "execution-continuity-conformance"
version = "0.1.0"
description = "Reference implementation and adversarial tests for distributed operation continuity."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = ["Development Status :: 3 - Alpha", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Topic :: Software Development :: Testing", "Topic :: System :: Distributed Computing"]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]

[project.scripts]
continuity-demo = "continuity_conformance.demo:main"

[tool.setuptools.packages.find]
include = ["continuity_conformance*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
